# CardioInsight AI - non-secret configuration
# Override any value via environment variables prefixed with CARDIOINSIGHT_
# (see .env.example and src/utils/config.py).

project:
  name: cardioinsight-ai
  random_seed: 42
  # Where to write experiment artifacts and model files.
  artifacts_dir: models

data:
  # Empty => use the bundled synthetic dataset (see data/README.md).
  # Otherwise a path to a CSV with the Cleveland heart disease schema.
  path:
  # Column that encodes the target (0 = no disease, 1 = disease present).
  target_column: target
  # Reproducible split.
  test_size: 0.2
  val_size: 0.1
  # Stratify on the target to preserve class proportions.
  stratify: true
  # Synthetic dataset parameters (only used when data.path is empty).
  synthetic:
    n_samples: 303
    positive_rate: 0.45
    noise: 0.35
    seed: 42

preprocessing:
  # Numeric features that must be standardised.
  numeric_features:
    - age
    - trestbps
    - chol
    - thalch
    - oldpeak
    - thalach
    - restecg
    - exang
    - slope
    - ca
    - thal
  # Categorical features (one-hot encoded).
  categorical_features:
    - sex
    - cp
    - fbs
    - restecg
  # Features dropped before modelling.
  drop_features: []

model:
  # Engine selection: auto | sklearn | numpy
  engine: auto
  # Baselines to train and compare.  All are supported by both engines.
  baselines:
    - logistic_regression
    - random_forest
    - gradient_boosting
    - naive_bayes
  # Hyperparameter search budget (grid search over a small, sensible space).
  cv_folds: 5
  n_jobs: 1
  # Which metric drives model selection on the validation fold.
  selection_metric: f1

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - specificity
    - f1
    - roc_auc
  # Threshold used to convert predicted probabilities into class labels.
  decision_threshold: 0.5

mlflow:
  enabled: false
  tracking_uri: file://./mlruns
  experiment_name: cardioinsight-heart-disease

dvc:
  enabled: false

app:
  page_title: CardioInsight AI
  page_icon: "❤️"
  layout: wide
  # Persistent disclaimer shown on every page.
  disclaimer: |
    CardioInsight AI is an educational machine learning demonstration. It is not
    a diagnostic tool and has not been validated for clinical decision-making.
    Outputs may be inaccurate and must not be used to make medical decisions.
    Consult a qualified healthcare professional for health concerns.