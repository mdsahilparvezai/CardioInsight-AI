[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardioinsight-ai"
version = "0.1.0"
description = "CardioInsight AI: an educational, explainable heart disease risk research platform."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "CardioInsight AI contributors" }]
keywords = ["machine-learning", "healthcare", "education", "explainability", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
xgb = ["xgboost>=2.0.0"]
shap = ["shap>=0.43.0"]
mlops = ["mlflow>=2.10.0", "dvc>=3.0.0"]
dev = ["pytest>=7.4.0"]

[project.scripts]
cardioinsight-train = "train:main"
cardioinsight-app = "app:main"

[tool.setuptools]
py-modules = ["train", "app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"